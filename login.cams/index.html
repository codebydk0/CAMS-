<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAMS Authentication</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- =====================================================
         LOGIN POPUP
    ====================================================== -->

    <div class="auth-overlay" id="authOverlay">

        <div class="auth-popup">


            <!-- =================================================
                 LOGIN SECTION
            ================================================== -->

            <section id="loginSection" class="auth-section">


                <!-- Logo -->

                <div class="logo-area">

                    <img
                        src="camslogo.jpeg"
                        alt="CAMS Logo"
                        class="cams-logo">

                </div>


                <!-- Welcome -->

                <h1 class="welcome-title">
                    Welcome back
                </h1>



                <!-- =================================================
                     LOGIN ROLE
                ================================================== -->

                <div class="login-role-section">

                    <h2>
                        Login as
                    </h2>


                    <div class="login-role-buttons">


                        <!-- Student -->

                        <button
                            type="button"
                            class="login-role active"
                            data-login-role="Student">

                            <i class="bi bi-person-fill"></i>

                            <span>
                                Student
                            </span>

                        </button>



                        <!-- Faculty -->

                        <button
                            type="button"
                            class="login-role"
                            data-login-role="Faculty">

                            <i class="bi bi-person-workspace"></i>

                            <span>
                                Faculty
                            </span>

                        </button>



                        <!-- Admin -->

                        <button
                            type="button"
                            class="login-role"
                            data-login-role="Admin">

                            <i class="bi bi-shield-lock-fill"></i>

                            <span>
                                Admin
                            </span>

                        </button>


                    </div>

                </div>



                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form id="loginForm">


                    <!-- Email / User ID -->

                    <div class="field">

                        <label>
                            Email / User ID
                        </label>


                        <div class="input-box">

                            <span class="input-icon">
                                <i class="bi bi-person"></i>
                            </span>


                            <input
                                type="text"
                                id="loginUser"
                                placeholder="Enter your email or user ID"
                                autocomplete="username">

                        </div>


                        <small id="loginUserError"></small>

                    </div>



                    <!-- Password -->

                    <div class="field">

                        <label>
                            Password
                        </label>


                        <div class="input-box">

                            <span class="input-icon">
                                <i class="bi bi-lock"></i>
                            </span>


                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                autocomplete="current-password">


                            <button
                                type="button"
                                class="eye-btn"
                                id="loginEye">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>


                        <small id="loginPasswordError"></small>


                        <!-- Forgot Password BELOW -->

                        <div class="forgot-password">

                            <a href="#" id="forgotPassword">
                                Forgot Password?
                            </a>

                        </div>

                    </div>



                    <!-- Remember -->

                    <div class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <label for="rememberMe">
                            Remember me
                        </label>

                    </div>



                    <!-- Login -->

                    <button
                        type="submit"
                        class="main-button">

                        Login

                    </button>


                </form>



                <!-- Register -->

                <div class="switch-account">

                    Don't have an account?

                    <button
                        type="button"
                        id="showRegister">

                        Register

                    </button>

                </div>


                <div
                    id="loginMessage"
                    class="message">
                </div>


            </section>



            <!-- =====================================================
                 REGISTER SECTION
            ====================================================== -->

            <section
                id="registerSection"
                class="auth-section hidden">


                <!-- Logo -->

                <div class="logo-area register-logo">

                    <img
                        src="camslogo.jpeg"
                        alt="CAMS Logo"
                        class="cams-logo">

                </div>


                <!-- Register Heading -->

                <h1 class="register-title">
                    Create Account
                </h1>



                <!-- =================================================
                     REGISTER FORM
                ================================================== -->

                <form id="registerForm">


                    <!-- =================================================
                         SELECT ROLE
                    ================================================== -->

                    <div class="field">

                        <label>
                            Select Role
                        </label>


                        <div
                            class="role-select"
                            id="roleSelect">


                            <div
                                class="role-select-button"
                                id="roleSelectButton">

                                <span id="selectedRoleText">

                                    Select your role

                                </span>


                                <i
                                    class="bi bi-chevron-down"
                                    id="roleArrow">
                                </i>

                            </div>


                            <!-- Dropdown -->

                            <div
                                class="role-dropdown"
                                id="roleDropdown">


                                <!-- Student -->

                                <button
                                    type="button"
                                    class="role-option"
                                    data-role="Student">

                                    <strong>Student</strong>

                                </button>



                                <!-- Faculty -->

                                <button
                                    type="button"
                                    class="role-option"
                                    data-role="Faculty">

                                    <strong>Faculty</strong>

                                </button>



                                <!-- Admin -->

                                <button
                                    type="button"
                                    class="role-option"
                                    data-role="Admin">

                                    <strong>Admin</strong>

                                </button>


                            </div>

                        </div>


                        <small id="registerRoleError"></small>

                    </div>



                    <!-- =================================================
                         NAME
                    ================================================== -->

                    <div class="field">

                        <label>
                            Full Name
                        </label>


                        <div class="input-box">

                            <span class="input-icon">
                                <i class="bi bi-person"></i>
                            </span>


                            <input
                                type="text"
                                id="registerName"
                                placeholder="Enter your full name">

                        </div>


                        <small id="registerNameError"></small>

                    </div>



                    <!-- =================================================
                         EMAIL
                    ================================================== -->

                    <div class="field">

                        <label>
                            Email Address
                        </label>


                        <div class="email-otp-row">

                            <div class="input-box">

                                <span class="input-icon">
                                    <i class="bi bi-envelope"></i>
                                </span>


                                <input
                                    type="email"
                                    id="registerEmail"
                                    placeholder="Enter your email">

                            </div>


                            <button
                                type="button"
                                class="otp-button"
                                id="sendOtp">

                                Send OTP

                            </button>

                        </div>


                        <small id="registerEmailError"></small>

                    </div>



                    <!-- =================================================
                         OTP
                    ================================================== -->

                    <div class="field">

                        <label>
                            Email OTP
                        </label>


                        <div class="email-otp-row">

                            <div class="input-box">

                                <span class="input-icon">
                                    <i class="bi bi-shield-check"></i>
                                </span>


                                <input
                                    type="text"
                                    id="otp"
                                    maxlength="6"
                                    placeholder="Enter 6-digit OTP">

                            </div>


                            <button
                                type="button"
                                class="verify-button"
                                id="verifyOtp">

                                Verify

                            </button>

                        </div>


                        <small id="otpError"></small>


                        <div
                            id="otpStatus"
                            class="otp-status">
                        </div>

                    </div>



                    <!-- =================================================
                         PASSWORD
                    ================================================== -->

                    <div class="field">

                        <label>
                            Password
                        </label>


                        <div class="input-box">

                            <span class="input-icon">
                                <i class="bi bi-lock"></i>
                            </span>


                            <input
                                type="password"
                                id="registerPassword"
                                placeholder="Create a password">


                            <button
                                type="button"
                                class="eye-btn"
                                id="registerEye">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>


                        <small id="registerPasswordError"></small>

                    </div>



                    <!-- =================================================
                         CONFIRM PASSWORD
                    ================================================== -->

                    <div class="field">

                        <label>
                            Confirm Password
                        </label>


                        <div class="input-box">

                            <span class="input-icon">
                                <i class="bi bi-lock-fill"></i>
                            </span>


                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password">


                            <button
                                type="button"
                                class="eye-btn"
                                id="confirmEye">

                                <i class="bi bi-eye"></i>

                            </button>

                        </div>


                        <small id="confirmPasswordError"></small>

                    </div>



                    <!-- =================================================
                         CREATE ACCOUNT
                    ================================================== -->

                    <button
                        type="submit"
                        class="main-button"
                        id="createAccountButton">

                        Create Account

                    </button>


                </form>



                <!-- =================================================
                     BACK TO LOGIN
                ================================================== -->

                <div class="switch-account">

                    Already have an account?

                    <button
                        type="button"
                        id="showLogin">

                        Login

                    </button>

                </div>


                <div
                    id="registerMessage"
                    class="message">
                </div>


            </section>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
